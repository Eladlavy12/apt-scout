name: scan

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHONE_HASH_SALT: ${{ secrets.PHONE_HASH_SALT }}
        run: python -m apt_scout --repo . --build-portal --portal-dir site

      - name: Publish portal
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

      - name: Commit state
        run: |
          git config user.name "apt-scout"
          git config user.email "apt-scout@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push
